/* Version 2: compact, photo-forward organizer cards */
:root{--ink:#202a25;--muted:#7c8880;--forest:#25614c;--paper:#f6f7f5;--line:#e5eae5}
header{background:linear-gradient(115deg,#193f32,#2c6851);border-radius:0 0 24px 24px;padding-bottom:78px}

</style></head><body><header><div class="header-inner"><div class="top"><div class="brand"><span class="mark">✳</span> Recipe Pocket</div><span class="pill" id="offlineBadge">Works offline</span></div><h1>Your recipes.<br>Beautifully organized.</h1><p>Save it once. Find it fast. Cook anywhere.</p></div></header><main><section class="search-panel"><label class="search"><span aria-hidden="true">⌕</span><input id="search" placeholder="Search recipes or ingredients…" autocomplete="off" aria-label="Search recipes or ingredients"></label><div class="chips" id="chips"></div></section><div class="section-title"><h2>All recipes</h2><span id="count"></span></div><section id="cards" class="grid" aria-live="polite"></section></main><nav class="toolbar" aria-label="Recipe actions"><button class="btn secondary icon-btn" id="settingsBtn" aria-label="Backup and settings">⚙</button><button class="btn" id="addBtn">＋ Add recipe</button></nav><section id="modal" class="modal" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="sheet-head"><h2 id="modalTitle"></h2><button class="close" id="closeModal" aria-label="Close">×</button></div><div id="modalContent"></div></div></section><div id="toast" class="toast" hidden></div><script>
'use strict';

function all(){return new Promise((res,rej)=>{let r=db.transaction('recipes').objectStore('recipes').getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function put(recipe){return new Promise((res,rej)=>{let tx=db.transaction('recipes','readwrite');tx.objectStore('recipes').put(recipe);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}

function showModal(title,html){$('#modalTitle').textContent=title;$('#modalContent').innerHTML=html;$('#modal').hidden=false;document.body.style.overflow='hidden';$('#closeModal').focus()}

$('#closeModal').onclick=closeModal;$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});
function render(){let c=$('#chips');c.innerHTML=cats.map(cat=>`<button class="chip ${cat===filter?'active':''}" data-cat="${cat}">${cat}</button>`).join('');c.querySelectorAll('button').forEach(b=>b.onclick=()=>{filter=b.dataset.cat;render()});let visible=recipes.filter(r=>(filter==='All'||r.category===filter)&&([r.title,r.description,r.ingredients,r.tags].join(' ').toLowerCase().includes(search))).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));$('#count').textContent=`${visible.length} ${visible.length===1?'recipe':'recipes'}`;$('#cards').innerHTML=visible.length?visible.map(r=>`<button class="recipe-card" data-id="${esc(r.id)}"><div class="card-image">${r.image?`<img loading="lazy" src="${r.image}" alt="">`:esc(placeholder[r.category]||'📖')}</div><div class="card-body"><div class="eyebrow">${esc(r.category||'Other')}</div><div class="card-title">${esc(r.title)}</div><div class="card-meta"><span>◷ ${esc(r.time||'No time set')}</span><span>${r.favorite?'♥ Favorite':''}</span></div></div></button>`).join(''):`<div class="empty" style="grid-column:1/-1"><div style="font-size:50px">📒</div><strong>${recipes.length?'No matching recipes':'Your cookbook starts here'}</strong><p>${recipes.length?'Try another search or category.':'Save a recipe and you can use it without internet.'}</p><button class="btn" id="emptyAdd">Add your first recipe</button></div>`;$('#cards').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>viewRecipe(b.dataset.id));$('#emptyAdd')?.addEventListener('click',()=>editRecipe());}
$('#search').addEventListener('input',e=>{search=e.target.value.toLowerCase().trim();render()});$('#addBtn').onclick=()=>editRecipe();$('#settingsBtn').onclick=settings;
function editRecipe(id){currentId=id||null;let r=recipes.find(x=>x.id===id)||{};showModal(id?'Edit recipe':'Add a recipe',`<form id="recipeForm"><label class="field" for="title">Recipe name *</label><input class="field-input" id="title" required maxlength="160" placeholder="Grandma's biscuits" value="${esc(r.title||'')}"><div class="two"><div><label class="field" for="category">Category</label><select class="field-input" id="category">${cats.slice(1).map(c=>`<option ${r.category===c?'selected':''}>${c}</option>`).join('')}</select></div><div><label class="field" for="time">Total time</label><input class="field-input" id="time" placeholder="30 min" value="${esc(r.time||'')}"></div></div><label class="field" for="description">Description</label><textarea class="field-input" id="description" rows="2" placeholder="A short note about this recipe">${esc(r.description||'')}</textarea><label class="field" for="ingredients">Ingredients</label><textarea class="field-input" id="ingredients" rows="6" placeholder="2 cups flour&#10;1 cup milk&#10;1 tsp salt">${esc(r.ingredients||'')}</textarea><p class="hint">One ingredient per line. You can check them off while cooking.</p><label class="field" for="steps">Directions</label><textarea class="field-input" id="steps" rows="7" placeholder="Preheat oven to 375°F&#10;Mix ingredients&#10;Bake for 20 minutes">${esc(r.steps||'')}</textarea><p class="hint">One step per line.</p><div class="two"><div><label class="field" for="servings">Servings</label><input class="field-input" id="servings" placeholder="4" value="${esc(r.servings||'')}"></div><div><label class="field" for="tags">Tags</label><input class="field-input" id="tags" placeholder="Easy, family" value="${esc(r.tags||'')}"></div></div><label class="field" for="source">Source website (optional)</label><input class="field-input" id="source" type="url" placeholder="https://..." value="${esc(r.source||'')}"><label class="field" for="imageInput">Recipe photo (optional)</label><input class="field-input" id="imageInput" type="file" accept="image/*"><p class="hint">Photos are stored on your phone, too. Keep them small to save storage space.</p><label style="display:flex;gap:9px;align-items:center;margin:14px 0"><input id="favorite" type="checkbox" ${r.favorite?'checked':''}> Mark as favorite ♥</label><div class="actions"><button class="btn" type="submit">Save recipe</button></div></form>`);$('#recipeForm').onsubmit=async e=>{e.preventDefault();try{let old=recipes.find(x=>x.id===currentId)||{},file=$('#imageInput').files[0];let image=old.image||'';if(file)image=await resizeImage(file);let next={...old,id:old.id||uid(),title:$('#title').value.trim(),category:$('#category').value,time:$('#time').value.trim(),description:$('#description').value.trim(),ingredients:$('#ingredients').value.trim(),steps:$('#steps').value.trim(),servings:$('#servings').value.trim(),tags:$('#tags').value.trim(),source:$('#source').value.trim(),image,favorite:$('#favorite').checked,updatedAt:Date.now()};if(!next.title)return;await put(next);recipes=await all();closeModal();render();toast('Recipe saved for offline use')}catch(err){alert('Could not save the recipe. Storage may be full. '+err.message)}};}
function resizeImage(file){return new Promise((resolve,reject)=>{if(file.size>15e6)return reject(new Error('Choose a photo under 15 MB'));let url=URL.createObjectURL(file),im=new Image();im.onload=()=>{let scale=Math.min(1,900/Math.max(im.width,im.height)),can=document.createElement('canvas');can.width=Math.round(im.width*scale);can.height=Math.round(im.height*scale);can.getContext('2d').drawImage(im,0,0,can.width,can.height);URL.revokeObjectURL(url);resolve(can.toDataURL('image/jpeg',.74))};im.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Image could not be loaded'))};im.src=url})}
function viewRecipe(id){currentId=id;let r=recipes.find(x=>x.id===id);if(!r)return;let ingredients=(r.ingredients||'').split('\n').map(x=>x.trim()).filter(Boolean),steps=(r.steps||'').split('\n').map(x=>x.trim()).filter(Boolean);showModal(r.title,`<div class="detail"><div class="detail-cover">${r.image?`<img src="${r.image}" alt="Recipe photo">`:esc(placeholder[r.category]||'📖')}</div><div class="eyebrow">${esc(r.category||'Other')}${r.favorite?' <span class="sup">♥ Favorite</span>':''}</div>${r.description?`<p class="detail-desc">${esc(r.description)}</p>`:''}<div class="stats"><div><small>TIME</small><strong>${esc(r.time||'—')}</strong></div><div><small>SERVINGS</small><strong>${esc(r.servings||'—')}</strong></div></div><h3>Ingredients <small style="font:13px sans-serif;color:#778679">(${ingredients.length})</small></h3>${ingredients.length?ingredients.map((x,i)=>`<label class="ingredient"><input type="checkbox"><span>${esc(x)}</span></label>`).join(''):'<p>No ingredients added yet.</p>'}<h3>Directions</h3>${steps.length?`<ol class="steps">${steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>`:'<p>No directions added yet.</p>'}${r.source?`<p><a class="source" target="_blank" rel="noopener noreferrer" href="${safeUrl(r.source)}">Original recipe ↗</a></p>`:''}<div class="actions"><button class="btn secondary" id="edit">✎ Edit</button><button class="btn secondary" id="share">↗ Share</button><button class="btn danger" id="delete">Delete</button></div></div>`);$('#edit').onclick=()=>editRecipe(r.id);$('#delete').onclick=async()=>{if(confirm(`Delete “${r.title}”? This cannot be undone unless you have a backup.`)){await remove(r.id);recipes=await all();closeModal();render();toast('Recipe deleted')}};$('#share').onclick=async()=>{let content=recipeText(r);try{if(navigator.share)await navigator.share({title:r.title,text:content});else{await navigator.clipboard.writeText(content);toast('Recipe copied')}}catch(err){if(err.name!=='AbortError')toast('Could not share')}};}
function safeUrl(s){try{let u=new URL(s);return ['https:','http:'].includes(u.protocol)?esc(u.href):'#'}catch{return '#'}}
function recipeText(r){return `${r.title}\n${r.category||''} • ${r.time||''}\n\nINGREDIENTS\n${r.ingredients||''}\n\nDIRECTIONS\n${r.steps||''}\n\n${r.source||''}`}
function settings(){showModal('Your cookbook & backups',`<div class="settings-row"><strong>Keep your recipes safe</strong><p>Your recipes and photos live on this device, not a company server. Export backups regularly, especially before deleting browser data or changing phones.</p><button class="btn" id="export">↓ Export backup (.json)</button></div><div class="settings-row"><strong>Restore or move recipes</strong><p>Import a Recipe Pocket backup. Existing recipes with matching IDs will be updated; others will be added.</p><label class="btn secondary" for="import" style="display:inline-block;cursor:pointer">↑ Import backup (.json)</label><input id="import" type="file" accept=".json,application/json" hidden></div><div class="settings-row"><strong>Website recipes</strong><p>For now, copy ingredients and instructions from a website into Add recipe, and paste the source link. Automatic website extraction is not included in this first version.</p></div><div class="settings-row"><strong>Offline setup</strong><p>Host these files on an HTTPS website, open it once while connected, then use Safari’s Share → Add to Home Screen. After that, the app can launch without internet. Keep a backup of your recipes.</p><span class="sup" id="network">${navigator.onLine?'Connected now':'Offline now'}</span></div>`);$('#export').onclick=()=>{let blob=new Blob([JSON.stringify({app:'Recipe Pocket',version:1,exportedAt:new Date().toISOString(),recipes},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='recipe-pocket-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('Backup created — save it somewhere safe')};$('#import').onchange=async e=>{let f=e.target.files?.[0];if(!f)return;try{let data=JSON.parse(await f.text());if(data.app!=='Recipe Pocket'||!Array.isArray(data.recipes))throw Error('Not a Recipe Pocket backup');if(data.recipes.length>5000)throw Error('Back async function init(){try{db=await openDB();recipes=await all();render()}catch(err){$('#cards').innerHTML='<div class="empty"><strong>Storage unavailable</strong><p>Try opening in Safari instead of a private browsing window.</p></div>';$('#addBtn').disabled=true;console.error(err)}if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});const status=()=>$('#offlineBadge').textContent=navigator.onLine?'Works offline':'● Offline';window.addEventListener('online',status);window.addEventListener('offline',status);status()};init();
</script></body></html>
