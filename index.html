<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#FAF7F2"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Dishkeep"><link rel="icon" href="icon.svg"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><title>Dishkeep — Your offline cookbook</title></head><body><div id="app"><header class="app-head"><div class="head-top"><div class="brand"><span class="brand-icon">◈</span> Dishkeep</div><button id="settingsBtn" class="circle-btn" aria-label="Settings">⚙</button></div><div class="head-sub"><span id="headDescription">Your recipes, right where you need them.</span><span id="networkStatus" aria-live="polite">Ready offline</span></div></header><main><section id="libraryView" class="view"><div class="page-title"><h1>Library</h1><button id="layoutToggle" class="text-btn" aria-label="Switch card layout">☷ List</button></div><div class="chips" id="filters" aria-label="Recipe filters"></div><div id="recipeGrid" class="recipe-grid" aria-live="polite"></div></section><section id="collectionsView" class="view" hidden><div class="page-title"><h1>Collections</h1><button id="newCollectionBtn" class="text-btn">+ New</button></div><div id="collectionGrid" class="collection-grid"></div></section><section id="searchView" class="view" hidden><div class="page-title"><h1>Search</h1></div><label class="search-box"><span>⌕</span><input id="searchInput" type="search" placeholder="Recipes, ingredients, notes…" aria-label="Search saved recipes"></label><p class="small muted">Search recipes, ingredients, directions and tags — even offline.</p><div id="searchResults" class="recipe-grid"></div></section></main><nav class="tabbar" aria-label="Main navigation"><button data-tab="library" class="tab active"><span
